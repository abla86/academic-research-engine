name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(!p.scripts.build||!p.scripts.test||!p.scripts.typecheck) process.exit(1)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
